name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project with dev deps
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Mypy
        run: mypy

      - name: Smoke test (zero-dependency check)
        run: python _smoke_test.py

  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 下限（3.11）与上限都测：本仓声明 >=3.11，而 3.13/3.14 上的解释器行为真的会
        # 变——v4-mapped 的 ``::ffff:127.0.0.1`` 在 3.11 上不被认作回环、3.12 上被
        # 认作回环，就是一个只在某个版本上才暴露的例子。
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project with dev deps
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov=ponte --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false

  # 依赖时序的断言只会**随机**报红：main 上 Python 3.11 (macos-latest) 就因为
  # "睡 0.3 秒后至少 3 次检查"拿到 2 而红过一次——不是产品代码错，而是断言考的是
  # "这台机器够快"。这条腿把那种机器搬进 CI（见 tests/_injection.py），于是这类测试
  # **当场**失败，而不是某天随机变红。两条轴各自独立：
  #   - 工作线程自己的等待被拉长；
  #   - 线程被 start() 了但迟迟跑不到第一行（等待被拉长管不到这种——它没有任何等待
  #     可拉长）。这条轴真的抓到过东西：它让 TunnelManager.connect 里 stderr drain
  #     线程的竞态（读已被清空的 self.process）从"偶尔"变成"每次"。
  #
  # 只跑一个 OS/版本：它的价值在确定性，不在覆盖率——版本/平台差异由上面的矩阵负责。
  timing:
    name: Timing guard (injected thread latency)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project with dev deps
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      # 故意不加 `-q`：报告头里的那两行横幅就是"守卫真的开着"的证据，下面 grep 它们。
      # 一条静默失效的注入会把这条腿变成空跑，而输出仍然是绿的。
      - name: Run tests with injected latency
        env:
          PONTE_TEST_THREAD_DELAY: "0.15"
          PONTE_TEST_THREAD_START_DELAY: "0.15"
        run: |
          set -o pipefail
          pytest 2>&1 | tee slow-runner.log
          grep -q "thread latency: +0.15s" slow-runner.log
          grep -q "thread start delay: +0.15s" slow-runner.log

  # 一条腿覆盖三个"环境"维度（不是平台维度，平台由上面的矩阵负责）。合成一条是因为
  # 它们都是同一件事的不同侧面：**这台机器不是开发者那台**。出错时 traceback 会指出
  # 是哪个维度，所以合并的代价只是少一次归因，换来少两个 job。
  #
  # - C locale + 非 UTF-8：CI 默认是 UTF-8，但真实服务器上 LANG 经常根本没设。
  #   PYTHONCOERCECLOCALE=0 是必须的——没有它 Python 会把 C locale 自动"挽救"成
  #   C.UTF-8（PEP 538），这条腿就变成空跑。ponte 的输出里有中文，所以这不是假想问题。
  # - 半时区偏移（UTC+5:30）：按整小时做的本地时间算术在这里会错一个小时的一半。
  # - 弃用告警当错误：这个小工具要长期支持 3.11+，用过就废的 API 应该当场红，
  #   而不是等某个版本把它删掉才红。
  env-edges:
    name: Environment edges (C locale, half-hour TZ, deprecations)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # pip 这一步在正常 locale 下跑：安装期的警告不是这条腿要考的东西。
      - name: Install project with dev deps
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run tests in a non-UTF-8 half-hour timezone
        env:
          LC_ALL: C
          LANG: C
          PYTHONCOERCECLOCALE: "0"
          PYTHONUTF8: "0"
          TZ: Asia/Kolkata
        run: pytest -W error::DeprecationWarning

  build:
    name: Build & verify wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: python -m pip install --upgrade build && python -m build

      # `ponte init` copies config.example.toml, so a wheel without it is a
      # broken install. Guard the packaging regression that shipped once.
      - name: Assert the example config is inside the wheel
        run: |
          python - <<'PY'
          import glob, os, sys, zipfile

          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheel produced"
          filename = os.path.basename(wheels[0])
          # The distribution name is what PyPI and `pip install` see; it must stay
          # `ponte-cli` while the import package and the command stay `ponte`.
          if not filename.startswith("ponte_cli-"):
              sys.exit(f"unexpected distribution name: {filename}")
          names = zipfile.ZipFile(wheels[0]).namelist()
          print("\n".join(names))
          if "ponte/config.example.toml" not in names:
              sys.exit("packaging regression: config.example.toml missing from the wheel")
          PY

      - name: Install the wheel and exercise the CLI
        run: |
          python -m pip install dist/*.whl
          ponte --version
          # Point HOME at an empty dir so `~/.ssh/id_rsa` cannot exist: the
          # template must then fail validation deterministically, with an
          # actionable message instead of a traceback.
          export HOME="$RUNNER_TEMP/fakehome"
          mkdir -p "$HOME"
          # `ponte init` is the documented first step: it must work from a
          # clean install, which is exactly what was broken before.
          ponte init --path "$RUNNER_TEMP/ci.toml"
          test -f "$RUNNER_TEMP/ci.toml"
          if ponte --config "$RUNNER_TEMP/ci.toml" config 2>err.txt; then
            echo "::error::placeholder config unexpectedly validated"
            exit 1
          fi
          grep -q "identity file" err.txt || {
            echo "::error::validation error is not actionable:"; cat err.txt; exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
