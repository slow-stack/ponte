[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name. The bare name `ponte` is already taken on PyPI by an
# unrelated project, so the distribution (what `pip install` and PyPI see) is
# `ponte-cli` -- while the import package (`packages = ["ponte"]` below), the
# console command (`[project.scripts] ponte`) and the repository name all stay
# `ponte`. Users install `ponte-cli` and still run `ponte ...`.
name = "ponte-cli"
dynamic = ["version"]
description = "Persistent SSH reverse tunnel daemon CLI (Windows / Linux / macOS)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Modusensus", email = "guanqishi26@gmail.com" }]
keywords = ["ssh", "reverse-tunnel", "tunnel", "daemon", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/modusensus/ponte"
Repository = "https://github.com/modusensus/ponte"
Issues = "https://github.com/modusensus/ponte/issues"
Changelog = "https://github.com/modusensus/ponte/blob/main/CHANGELOG.md"

[project.scripts]
ponte = "ponte.main:app"

[tool.setuptools]
packages = ["ponte"]

[tool.setuptools.dynamic]
version = { attr = "ponte.__version__" }

# The example config is a *runtime* asset: `ponte init` copies it, so it must
# ship in the wheel. Without this the installed package cannot create a config
# file at all (the previous layout shipped nothing usable).
[tool.setuptools.package-data]
ponte = ["config.example.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["ponte"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# 阈值：低于此值 CI 视为失败，防止覆盖率回退。
# 当前实测约 79%（Windows），跨平台留出余量；目标见 CHANGELOG 的 80% 计划。
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # 交给格式化器；仓库里有较长的 PowerShell/XML 内嵌字符串
]

[tool.ruff.lint.per-file-ignores]
"_smoke_test.py" = ["E402", "E701", "E702", "F841", "B011", "UP031"]
"tests/*" = ["B011"]
# typer 要求 Option/Argument 作为参数默认值出现。
"ponte/main.py" = ["B008"]

[tool.ruff.lint.isort]
# tests/ 下以单下划线开头的内部助手（"等待"与"负载注入"）是本仓库的代码，不是第三方
# 包。不声明的话 ruff 会把它们归到第三方段，于是 import 分组传达的信息是错的。
known-first-party = ["ponte", "_injection", "_waits"]

[tool.mypy]
python_version = "3.11"
files = ["ponte"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
