# ponte 配置模板
#
# 不要直接编辑本文件：它在 Python 包目录内，`pip install -U` 会覆盖它。
# 正确用法：
#   ponte init            # 复制到用户配置目录并提示路径
#   ponte config          # 打印当前生效的配置与来源文件
#
# 配置查找顺序（先找到的生效）：
#   1. --config <path>
#   2. 环境变量 PONTE_CONFIG
#   3. 用户配置目录（Windows: %APPDATA%\ponte\config.toml
#                       Linux:   ~/.config/ponte/config.toml
#                       macOS:   ~/Library/Application Support/ponte/config.toml）
#   4. 包内旧位置 ponte/config.toml（已废弃，仅兼容老安装）
#
# 所有路径支持 ~ 与环境变量展开。

[ssh]
host = "YOUR_SERVER_IP"
port = 22
user = "YOUR_SSH_USER"
# 按各平台 SSH 惯例放密钥即可（~ 自动展开）；如需自定义路径请直接改这里
identity_file = "~/.ssh/id_rsa"
known_hosts_file = "~/.ssh/known_hosts"

[ssh.options]
StrictHostKeyChecking = "accept-new"
ServerAliveInterval = 30
ServerAliveCountMax = 3
ExitOnForwardFailure = "yes"
TCPKeepAlive = "yes"
# 其它未列出的键会被原样透传为 `-o key=value`，例如：
# Compression = "yes"

# 转发规则。每条规则的 local_host:local_port 都是「本机这一端」，
# remote_host:remote_port 都是「服务器那一端」；kind 决定用哪个 ssh 转发开关。
#
#   kind = "remote"  （默认，-R）服务器监听 remote_port，转发回本机 local_host:local_port
#   kind = "local"     （-L）本机监听 local_host:local_port，经服务器转发到 remote_host:remote_port
#   kind = "dynamic"   （-D）本机在 local_host:local_port 上跑一个 SOCKS5 代理
#
# 同一配置文件里可以混用，三种规则共用一条 SSH 连接。
# kind = "local"/"dynamic" 省略 local_host 时默认绑定 127.0.0.1（只本机可达）。

# 反向隧道：在服务器上打开 23334，转发回本机 2222
[[tunnels]]
kind = "remote"
remote_port = 23334
local_host = "localhost"
local_port = 2222
description = "示例：把远端 23334 转发到本地 2222"
# 仅在服务器 GatewayPorts=yes 时才需要指定服务器侧的绑定地址
# remote_host = "127.0.0.1"

# 本地转发：本机 8080 → 经服务器访问内网 db.internal:5432
# [[tunnels]]
# kind = "local"
# local_host = "127.0.0.1"   # 本机监听地址，可省略
# local_port = 8080          # 本机监听端口
# remote_host = "db.internal"
# remote_port = 5432
# description = "示例：本机 8080 转发到内网数据库"

# 动态转发：本机 1080 上开一个 SOCKS5 代理，目标由客户端每次连接自行选择
# [[tunnels]]
# kind = "dynamic"
# local_host = "127.0.0.1"   # 可省略
# local_port = 1080
# description = "示例：本机 SOCKS5 代理"

# ---------------------------------------------------------------------------
# 多隧道：一个守护进程监督多条 SSH 连接
#
# 与上面的顶层 [ssh] + [[tunnels]] 二选一。写了 [[profiles]] 就要把连接参数全部
# 搬进各 profile；两者混用会被直接拒绝（顶层 [[tunnels]] 到底属于哪条连接是有歧义
# 的）。retry / health / daemon / service 仍是全局策略，所有 profile 共用。
#
# 每条 profile 各自重连、各自健康检查，互不影响；ponte status 与 ponte watch
# 会按 profile 分行展示，ponte test / check 可用 --profile NAME 只看一条。
#
# [[profiles]]
# name = "web"
#   [profiles.ssh]
#   host = "YOUR_SERVER_IP"
#   user = "YOUR_SSH_USER"
#   identity_file = "~/.ssh/id_rsa"
#   [[profiles.tunnels]]
#   remote_port = 8080
#   local_host = "127.0.0.1"
#   local_port = 80
#
# [[profiles]]
# name = "db"
#   [profiles.ssh]
#   host = "OTHER_SERVER_IP"
#   user = "YOUR_SSH_USER"
#   identity_file = "~/.ssh/id_rsa"
#   [[profiles.tunnels]]
#   kind = "local"
#   local_port = 5432
#   remote_host = "db.internal"
#   remote_port = 5432

[daemon]
# pid_file / log_file 缺省时按平台自动选择：
#   Windows: %LOCALAPPDATA%\ponte\
#   Linux:   ~/.local/state/ponte/
#   macOS:   ~/Library/Application Support/ponte/
# 需要自定义时在此指定，支持 ~ 展开。
# pid_file = "~/ponte.pid"
# log_file = "~/ponte.log"
log_max_bytes = 10485760   # 10 MB
log_backup_count = 3

[retry]
max_retries = 0            # 0 = 无限重试
base_delay = 5             # 首次重连等待秒数
max_delay = 300            # 退避上限（5 分钟）
backoff_factor = 2.0
jitter = true              # 全抖动，避免多机同时重连
stable_after = 60          # 会话稳定运行超过该秒数后重试预算归零

[health]
check_interval = 60        # 健康检查间隔（秒）
remote_check_enabled = true
remote_check_timeout = 10  # 单次远程探测超时（秒）
max_check_interval = 300   # 连续失败时检查间隔的退避上限（秒）

[notify]
# 隧道连续掉线时主动告警。默认关闭：不开就不会外发任何数据。
enabled = false
# 连续失败多少次后告警。会话稳定运行 >= stable_after 秒算「恢复」，
# 计数归零并重新武装，所以下一次故障会再报一次。
on_consecutive_failures = 3
# 同一 profile 两条告警之间的最小间隔（秒）。一夜断线 = 每个窗口一条，
# 而不是每次重连都发。
cooldown = 900
# 通道一：ntfy（app 或自建服务都能收）。topic 留空即不用该通道。
# ntfy_topic = "ponte-alerts-你的随机后缀"
# ntfy_server = "https://ntfy.sh"
# ntfy_token = "tk_xxxxxxxx"   # 受保护主题才需要
# 通道二：通用 webhook，告警以 JSON POST 过去（企业微信/飞书/Slack 中转都行）。
# webhook_url = "https://example.com/hooks/ponte"
# 两个通道可以同时配。配好后用 `ponte notify-test` 验证真能收到。

[serve]
# 本地 HTTP 看板 / 指标（ponte serve）。默认只监听本机：看板会列出服务器
# 地址、登录用户与转发端口，等于一张内网拓扑图，因此默认不对外。
host = "127.0.0.1"
port = 8787
# 想让局域网或反向代理访问就必须设一个令牌，否则 ponte serve 直接拒绝启动。
# 客户端用 ?token=... 或 Authorization: Bearer ... 带上它。
# token = "一个足够长的随机串"
refresh = 5                # 看板自动刷新间隔（秒）；接口本身从不缓存

[service]
# 开机自启服务身份（Linux systemd 单元名 / macOS launchd label 后缀）
name = "ponte"
autostart = true
kill_timeout = 5           # POSIX 优雅终止等待秒数，超时后 SIGKILL

[windows]
# 仅 Windows 使用
task_name = "SSH-Reverse-Tunnel"
# ssh_exe 缺省时按 PATH 自动查找；如需固定路径再取消注释
# ssh_exe = "C:\\Windows\\System32\\OpenSSH\\ssh.exe"
#
# pythonw_exe：计划任务使用的「无窗口」解释器。缺省时优先用 sys.executable
# 同目录的 pythonw.exe。必须是无窗口解释器——否则每次登录都会闪出黑色
# 控制台窗口；若两者都找不到，ponte install 会直接报错并给出提示，
# 而不是静默退回 python.exe 去弹窗。
# pythonw_exe = "C:\\Python312\\pythonw.exe"
# run_as = "user"    # 默认：登录后以当前用户运行，能读 ~/.ssh 密钥、免提权
# run_as = "system"  # 开机即起（登录前就通）：以 SYSTEM 运行，需提权，且读不到用户密钥
run_as = "user"
